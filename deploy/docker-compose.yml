# Production stack for recharacter.us — runs on Qavren-Web-Server (rootless
# docker). NO published ports: ingress is exclusively the Cloudflare Tunnel
# (cloudflared dials out), so the box needs no open inbound HTTP at all.
# Tunnel public hostname routes: recharacter.us -> http://web:3000

name: recharacter

services:
  web:
    image: ghcr.io/stevenfackley/recharacter-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ROUTING_API_URL: http://routing:8080
    depends_on:
      routing:
        condition: service_healthy
    healthcheck:
      # node:26-alpine (the web image's base) has busybox wget but no curl.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  routing:
    image: ghcr.io/stevenfackley/recharacter-routing:latest
    restart: unless-stopped
    healthcheck:
      # aspnet:10.0 has bash but no curl/wget, so speak raw HTTP over
      # bash's /dev/tcp instead of shipping an extra tool into the image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web
