# Local stack for web/ development and the integration suites.
#   docker compose -f compose.dev.yaml up -d
#   DATABASE_URL=postgres://recharacter:recharacter@127.0.0.1:55433/recharacter
#   S3_ENDPOINT=http://127.0.0.1:9100  R2_ACCESS_KEY_ID=minio  R2_SECRET_ACCESS_KEY=minio12345  R2_BUCKET=recharacter-dev  R2_ACCOUNT_ID=local
name: recharacter-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recharacter
      POSTGRES_PASSWORD: recharacter
      POSTGRES_DB: recharacter
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recharacter -d recharacter"]
      interval: 5s
      timeout: 3s
      retries: 10
  rustfs:
    # Host ports 9100/9101: 9000 is Keycloak's management port when the local
    # qavren-auth stack is up on the same machine.
    # RustFS, not MinIO: MinIO stopped publishing public images (Docker Hub and
    # quay.io both 401 anonymous pulls since 2026-09). S3-compatible drop-in;
    # pinned so the dev stack matches CI. Credentials keep the old values so
    # existing .env files still work.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9100:9000", "9101:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
