# Dependabot configuration.
#
# Policy (matches the SquareLog dependabot-sweep policy):
#   * minor + patch updates are grouped per ecosystem so one monthly PR
#     catches them all; majors stay separate so each gets its own review.
#   * fleet guardrail (2026-09-04): monthly schedule, at most 3 open PRs
#     per ecosystem, America/New_York.
#
# Ecosystem directories below were derived from the manifests actually
# present in this repo. Updaters that do not recurse (npm, pip, docker,
# terraform, gomod) get one directory listed per manifest location.
version: 2
updates:

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "dotnet"
    commit-message:
      prefix: "deps(nuget)"
      include: "scope"
    groups:
      dotnet-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      javascript-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-config-next@16.x (the version this repo's Next release
      # supports) bundles eslint-plugin-react@^7.37.x, whose peerDependencies
      # top out at "^9.7" — it does not support ESLint 10 yet. Bumping past
      # 9.x breaks `npm run lint` (see PR that reverted the 9->10 bump).
      # Revisit once eslint-config-next ships peer support for ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/src/ReCharacter.RoutingApi"
      - "/web"
      - "/deploy"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(github-actions)"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
